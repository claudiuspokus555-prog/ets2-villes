<title>ETS2 — Carte Europe (FR)</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg:#080d12; --panel:#0f1720; --border:#1a2840; --text:#c5d8e8; --dim:#4a6070; --accent:#e8a020; }
body { background:var(--bg); color:var(--text); font-family:'Rajdhani',sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
header { background:var(--panel); border-bottom:2px solid #1a3050; padding:7px 13px; display:flex; gap:9px; align-items:center; flex-wrap:wrap; flex-shrink:0; z-index:20; }
.logo { font-size:1.3rem; font-weight:700; letter-spacing:3px; color:var(--accent); text-shadow:0 0 15px rgba(232,160,32,.4); white-space:nowrap; }
.logo span { color:var(--text); }
.search-wrap { position:relative; }
#searchBox { background:var(--bg); border:1px solid var(--border); color:var(--text); padding:5px 10px; font-family:'Share Tech Mono',monospace; font-size:.8rem; outline:none; width:210px; }
#searchBox:focus { border-color:var(--accent); }
#searchResults { position:absolute; top:30px; left:0; background:var(--panel); border:1px solid var(--accent); max-height:280px; overflow-y:auto; z-index:200; display:none; font-family:'Share Tech Mono',monospace; font-size:.78rem; min-width:280px; }
.sr-item { padding:5px 10px; cursor:pointer; border-bottom:1px solid var(--border); display:flex; gap:8px; align-items:flex-start; }
.sr-item:hover { background:#1a2840; }
.sr-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:4px; }
.sr-main { display:flex; flex-direction:column; }
.sr-name { color:var(--text); font-size:.85rem; font-family:'Rajdhani',sans-serif; font-weight:600; }
.sr-alt { color:var(--dim); font-size:.68rem; }
.sr-meta { color:var(--dim); font-size:.68rem; }
.legend-wrap { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; font-family:'Share Tech Mono',monospace; font-size:.68rem; }
.leg { display:flex; align-items:center; gap:4px; cursor:pointer; padding:2px 4px; border:1px solid transparent; user-select:none; transition:border-color .2s; }
.leg:hover { border-color:var(--border); }
.leg.off { opacity:.3; }
.leg-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.options { display:flex; gap:6px; align-items:center; margin-left:2px; }
.opt-btn { background:var(--panel); border:1px solid var(--border); color:var(--text); padding:3px 8px; font-family:'Share Tech Mono',monospace; font-size:.68rem; cursor:pointer; transition:border-color .2s,color .2s; white-space:nowrap; }
.opt-btn:hover,.opt-btn.active { border-color:var(--accent); color:var(--accent); }
.zoom-wrap { display:flex; gap:3px; margin-left:auto; }
.zb { background:var(--panel); border:1px solid var(--border); color:var(--text); width:26px; height:26px; cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; transition:border-color .2s,color .2s; }
.zb:hover { border-color:var(--accent); color:var(--accent); }
.zb.wide { width:42px; font-size:.62rem; font-family:'Share Tech Mono',monospace; }
#counter { font-family:'Share Tech Mono',monospace; font-size:.7rem; color:var(--dim); white-space:nowrap; }
.map-area { flex:1; overflow:hidden; cursor:grab; position:relative; }
.map-area.drag { cursor:grabbing; }
svg#map { width:100%; height:100%; display:block; }
.country-shape { transition:fill .3s; }
.country-shape:hover { fill-opacity:.25 !important; }
.city-g { cursor:pointer; }
.city-g:hover .cdot { filter:brightness(1.8); }
.cdot { transition:r .1s; }
.clabel { font-family:'Rajdhani',sans-serif; font-weight:600; pointer-events:none; paint-order:stroke fill; }
.country-label { pointer-events:none; font-family:'Rajdhani',sans-serif; font-weight:700; fill:rgba(255,255,255,0.55); paint-order:stroke fill; text-anchor:middle; dominant-baseline:middle; }
.tooltip { position:absolute; background:var(--panel); border:1px solid var(--accent); padding:7px 12px; font-family:'Share Tech Mono',monospace; font-size:.76rem; pointer-events:none; display:none; z-index:100; max-width:240px; box-shadow:0 0 20px rgba(232,160,32,.15); line-height:1.7; }
.tt-name { font-family:'Rajdhani',sans-serif; font-size:1.1rem; font-weight:700; }
.tt-alt { font-size:.68rem; opacity:.6; }
.tt-dlc { font-size:.68rem; }
.infobar { padding:4px 13px; background:var(--panel); border-top:1px solid var(--border); font-family:'Share Tech Mono',monospace; font-size:.66rem; color:var(--dim); display:flex; gap:14px; flex-shrink:0; }
</style>
</head>

<header>

// ============================================================
// PROJECTION — Mercator
// ============================================================
const SVG_W=1600, SVG_H=900, LON_MIN=-12, LON_MAX=36, LAT_MIN=33, LAT_MAX=72;
function merc(lat){return Math.log(Math.tan(Math.PI/4+lat*Math.PI/360));}
const mercMin=merc(LAT_MIN), mercMax=merc(LAT_MAX);
function proj(lat,lon){
  return {
    x:(lon-LON_MIN)/(LON_MAX-LON_MIN)*SVG_W,
    y:(1-(merc(lat)-mercMin)/(mercMax-mercMin))*SVG_H
  };
}
function polyPath(poly){
  // poly = array of [lon,lat]
  return poly.map((p,i)=>{
    const {x,y}=proj(p[1],p[0]);
    return (i===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1);
  }).join(' ')+'Z';
}

// ============================================================
// STATE
// ============================================================
let scale=1,tx=0,ty=0,isDrag=false,sx,sy,stx,sty;
const dlcVisible={};Object.keys(DLC).forEach(k=>dlcVisible[k]=true);
let showBorders=true, showCNames=true;
const mapArea=document.getElementById('mapArea');
const svgEl=document.getElementById('map');
const ttEl=document.getElementById('tooltip');
let gCountries, gCLabels, gCities;

// ============================================================
// BUILD
// ============================================================
function buildSVG(){
  svgEl.innerHTML='';
  svgEl.setAttribute('viewBox',`0 0 ${SVG_W} ${SVG_H}`);
  svgEl.setAttribute('preserveAspectRatio','xMidYMid meet');
  svgEl.appendChild(mk('rect',{width:SVG_W,height:SVG_H,fill:'#080d12'}));

  // Grid
  const grid=mk('g',{});
  for(let lon=-10;lon<=35;lon+=5){
    const a=proj(LAT_MIN,lon),b=proj(LAT_MAX,lon);
    grid.appendChild(mk('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#0e1a26','stroke-width':0.6}));
  }
  for(let lat=35;lat<=70;lat+=5){
    const a=proj(lat,LON_MIN),b=proj(lat,LON_MAX);
    grid.appendChild(mk('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#0e1a26','stroke-width':0.6}));
  }
  svgEl.appendChild(grid);

  // Country shapes
  gCountries=mk('g',{id:'gCountries'});
  svgEl.appendChild(gCountries);

  // Country labels
  gCLabels=mk('g',{id:'gCLabels'});
  svgEl.appendChild(gCLabels);

  Object.entries(COUNTRIES).forEach(([key,cdata])=>{
    // Draw all polygons for this country
    cdata.polys.forEach(poly=>{
      const path=mk('path',{
        d:polyPath(poly),
        fill:'rgba(255,255,255,0.04)',
        stroke:'rgba(255,255,255,0.35)',
        'stroke-width':0.8,
        'stroke-linejoin':'round',
        class:'country-shape'
      });
      gCountries.appendChild(path);
    });

    // Country label
    const lp=proj(cdata.lLat, cdata.lLon);
    const lbl=mk('text',{
      x:lp.x, y:lp.y,
      'font-size':11,
      class:'country-label',
      stroke:'rgba(0,0,0,0.7)',
      'stroke-width':3,
      'stroke-linejoin':'round',
      'paint-order':'stroke fill'
    });
    lbl.textContent=cdata.fr;
    gCLabels.appendChild(lbl);
  });

  // Cities
  gCities=mk('g',{id:'gCities'});
  svgEl.appendChild(gCities);

  cities.forEach((city,i)=>{
    const p=proj(city.lat,city.lon);
    const col=DLC[city.dlc].color;
    const r=city.cap?5:3;
    const g=mk('g',{class:'city-g','data-idx':i});
    g.style.display=dlcVisible[city.dlc]?'':'none';

    g.appendChild(mk('circle',{cx:p.x,cy:p.y,r,fill:col,class:'cdot',
      stroke:city.cap?'#fff':col,'stroke-width':city.cap?1.5:0,opacity:0.9}));

    const fs=city.cap?11:9;
    const txt=mk('text',{x:p.x+r+2,y:p.y+4,'font-size':fs,fill:col,
      stroke:'#080d12','stroke-width':2.5,'stroke-linejoin':'round',
      class:'clabel','data-dlc':city.dlc,'paint-order':'stroke fill',
      'font-weight':city.cap?'700':'600'});
    txt.textContent=city.name;
    g.appendChild(txt);

    g.addEventListener('mouseenter',e=>showTT(e,city,col));
    g.addEventListener('mouseleave',hideTT);
    g.addEventListener('click',e=>{e.stopPropagation();showTT(e,city,col);});
    gCities.appendChild(g);
  });

  applyTransform();
}

function mk(tag,attrs){
  const el=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
  return el;
}

// ============================================================
// TRANSFORM
// ============================================================
function applyTransform(){
  const t=`translate(${tx},${ty}) scale(${scale})`;
  gCountries.setAttribute('transform',t);
  gCLabels.setAttribute('transform',t);
  gCities.setAttribute('transform',t);
  document.getElementById('zlevel').textContent=`Zoom: ${scale.toFixed(1)}×`;
  adaptScale();
}

function adaptScale(){
  // Dots
  svgEl.querySelectorAll('.cdot').forEach(c=>{
    const base=c.getAttribute('stroke')==='#fff'?5:3;
    c.setAttribute('r', base/Math.max(scale,0.5));
  });
  // City labels
  svgEl.querySelectorAll('.clabel').forEach(t=>{
    const base=t.closest('.city-g').querySelector('.cdot').getAttribute('stroke')==='#fff'?11:9;
    t.setAttribute('font-size', Math.max(5,base/Math.max(scale,0.5)));
    t.setAttribute('stroke-width', 2.5/Math.max(scale,0.5));
  });
  // Country borders
  svgEl.querySelectorAll('.country-shape').forEach(p=>{
    p.setAttribute('stroke-width', 0.8/Math.max(scale,0.5));
  });
  // Country labels
  svgEl.querySelectorAll('.country-label').forEach(t=>{
    t.setAttribute('font-size', Math.max(7,11/Math.max(scale,0.5)));
    t.setAttribute('stroke-width', 3/Math.max(scale,0.5));
  });
}

// ============================================================
// PAN / ZOOM
// ============================================================
mapArea.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=mapArea.getBoundingClientRect();
  const scX=SVG_W/rect.width, scY=SVG_H/rect.height;
  const mx=(e.clientX-rect.left)*scX, my=(e.clientY-rect.top)*scY;
  const d=e.deltaY<0?1.15:0.87;
  const ns=Math.min(14,Math.max(0.4,scale*d));
  tx=mx-(mx-tx)*(ns/scale); ty=my-(my-ty)*(ns/scale); scale=ns;
  applyTransform();
},{passive:false});

mapArea.addEventListener('mousedown',e=>{
  isDrag=true; sx=e.clientX; sy=e.clientY; stx=tx; sty=ty;
  mapArea.classList.add('drag');
});
document.addEventListener('mousemove',e=>{
  if(!isDrag)return;
  const rect=mapArea.getBoundingClientRect();
  tx=stx+(e.clientX-sx)*(SVG_W/rect.width);
  ty=sty+(e.clientY-sy)*(SVG_H/rect.height);
  applyTransform();
});
document.addEventListener('mouseup',()=>{isDrag=false;mapArea.classList.remove('drag');});
document.getElementById('zIn').onclick=()=>{scale=Math.min(14,scale*1.3);applyTransform();};
document.getElementById('zOut').onclick=()=>{scale=Math.max(0.4,scale/1.3);applyTransform();};
document.getElementById('zReset').onclick=()=>{scale=1;tx=0;ty=0;applyTransform();};

// ============================================================
// TOGGLE BUTTONS
// ============================================================
document.getElementById('btnBorders').addEventListener('click',function(){
  showBorders=!showBorders;
  this.classList.toggle('active',showBorders);
  gCountries.style.display=showBorders?'':'none';
});
document.getElementById('btnCountryNames').addEventListener('click',function(){
  showCNames=!showCNames;
  this.classList.toggle('active',showCNames);
  gCLabels.style.display=showCNames?'':'none';
});

// ============================================================
// TOOLTIP
// ============================================================
function showTT(e,city,col){
  const hasAlt=city.nameAlt&&city.nameAlt!==city.name;
  ttEl.innerHTML=`
    <div class="tt-name" style="color:${col}">${city.name}</div>
    ${hasAlt?`<div class="tt-alt">${city.nameAlt}</div>`:''}
    <div style="color:#8ab0c8">${city.country}</div>
    <div class="tt-dlc" style="color:${col}">${DLC[city.dlc].label}</div>
    ${city.cap?'<div style="color:#ffcc44;font-size:.7rem">★ Capitale</div>':''}
  `;
  ttEl.style.display='block';
  moveTT(e);
}
function hideTT(){ttEl.style.display='none';}
function moveTT(e){
  let x=e.clientX+14,y=e.clientY-36;
  if(x+240>window.innerWidth)x=e.clientX-255;
  if(y<0)y=e.clientY+10;
  ttEl.style.left=x+'px';ttEl.style.top=y+'px';
}
mapArea.addEventListener('mousemove',e=>{if(ttEl.style.display==='block')moveTT(e);});

// ============================================================
// LEGEND
// ============================================================
const legendWrap=document.getElementById('legend');
Object.entries(DLC).forEach(([key,dlc])=>{
  const el=document.createElement('div');
  el.className='leg'; el.dataset.key=key;
  el.innerHTML=`<div class="leg-dot" style="background:${dlc.color}"></div><span>${dlc.label}</span>`;
  el.addEventListener('click',()=>{
    dlcVisible[key]=!dlcVisible[key];
    el.classList.toggle('off',!dlcVisible[key]);
    svgEl.querySelectorAll('.city-g').forEach(g=>{
      if(cities[+g.dataset.idx].dlc===key)g.style.display=dlcVisible[key]?'':'none';
    });
  });
  legendWrap.appendChild(el);
});

// ============================================================
// SEARCH
// ============================================================
const searchBox=document.getElementById('searchBox');
const searchRes=document.getElementById('searchResults');

function norm(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,'');
}
searchBox.addEventListener('input',()=>{
  const q=norm(searchBox.value.trim());
  if(!q){searchRes.style.display='none';return;}
  const matches=cities.filter(c=>norm(c.name).includes(q)||norm(c.nameAlt).includes(q)||norm(c.country).includes(q)).slice(0,25);
  if(!matches.length){searchRes.style.display='none';return;}
  searchRes.innerHTML='';
  matches.forEach(c=>{
    const d=document.createElement('div');d.className='sr-item';
    const col=DLC[c.dlc].color;
    const hasAlt=c.nameAlt&&c.nameAlt!==c.name;
    d.innerHTML=`<div class="sr-dot" style="background:${col}"></div>
      <div class="sr-main">
        <span class="sr-name">${c.name}</span>
        ${hasAlt?`<span class="sr-alt">${c.nameAlt}</span>`:''}
        <span class="sr-meta">${c.country} · ${DLC[c.dlc].label}</span>
      </div>`;
    d.addEventListener('click',()=>{flyTo(c);searchRes.style.display='none';searchBox.value='';});
    searchRes.appendChild(d);
  });
  searchRes.style.display='block';
});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))searchRes.style.display='none';});

function flyTo(city){
  const p=proj(city.lat,city.lon);
  const rect=mapArea.getBoundingClientRect();
  scale=5;
  tx=(rect.width/2)*(SVG_W/rect.width)-p.x*scale;
  ty=(rect.height/2)*(SVG_H/rect.height)-p.y*scale;
  applyTransform();
}

document.getElementById('counter').textContent=`${cities.length} villes`;
buildSVG();
</script>
